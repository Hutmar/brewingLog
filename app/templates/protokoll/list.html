{% extends "base.html" %}
{% block title %}Protokoll – Brauprotokoll{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Protokoll</h1>
  <a class="button" href="/protokoll/neu">Neuer Sud</a>
</div>

<div class="search">
  <input type="search" name="q" value="{{ overview.prefs.q }}" placeholder="Rezept suchen …"
         aria-label="Rezept suchen" autocomplete="off" maxlength="100"
         hx-get="/protokoll/tabelle" hx-trigger="input changed delay:300ms, search"
         hx-target="#log-table" hx-swap="outerHTML" hx-params="q">
</div>

{% include "protokoll/_table.html" %}
{% endblock %}
